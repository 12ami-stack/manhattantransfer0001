<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><title>Satellite Sniper Game</title>
    <style>
        body { margin: 0; background: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; user-select: none; }
        #gameContainer { position: relative; box-shadow: 0 0 20px rgba(0, 255, 200, 0.2); border-radius: 8px; overflow: hidden; }
        canvas { background: linear-gradient(to bottom, #1a1c2e, #0c0d14); display: block; }
        .instructions { margin-top: 15px; max-width: 800px; font-size: 13px; color: #aaa; background: #222; padding: 12px; border-radius: 6px; border-left: 4px solid #00ffcc; line-height: 1.5; }
        #uiOverlay { position: absolute; top: 20px; left: 20px; pointer-events: none; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px #000; }
        #statusMessage { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; font-weight: bold; color: #ff3366; text-shadow: 0 0 10px rgba(255,51,102,0.5); display: none; text-align: center; background: rgba(0,0,0,0.9); padding: 20px 40px; border-radius: 10px; border: 2px solid #ff3366; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div id="uiOverlay">SCORE: <span id="scoreVal">0</span> | HP: <span id="hpVal">100</span>%</div>
        <div id="statusMessage">GAME OVER<br><span style="font-size:20px; color:#fff;">Enterキーで再挑戦</span></div>
    </div>
    <div class="instructions">👉 <strong>操作:</strong> 【矢印キー】狙撃衛星を移動 | 【Enterキー長押し】顔出し(エイム) | 【顔出し中にSpaceキー】狙撃発射（衛星に当たると跳弾！）</div>
<script>
const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d'), scoreVal = document.getElementById('scoreVal'), hpVal = document.getElementById('hpVal'), statusMessage = document.getElementById('statusMessage');
let score = 0, hp = 100, gameOver = false, playerBullets = [], enemyBullets = [], enemies = [], particles = [];
const player = { x: 60, y: 150, baseY: 150, isAiming: false, cooldown: 0 }, satellite = { x: 400, y: 150, radius: 15, active: true, pulse: 0, speed: 5 }, rock = { x: 80, y: 140, w: 40, h: 70 };
const mountain = [{x:0, y:500}, {x:120, y:200}, {x:250, y:200}, {x:350, y:380}, {x:500, y:380}, {x:600, y:500}];
const keys = {};

window.addEventListener('keydown', (e) => { keys[e.code] = true; if(e.code==='Enter') { if(gameOver) { resetGame(); return; } player.isAiming = true; } if(e.code==='Space' && player.isAiming && player.cooldown<=0 && !gameOver) shootSniper(); if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); });
window.addEventListener('keyup', (e) => { keys[e.code] = false; if(e.code==='Enter') player.isAiming = false; });

function shootSniper() { player.cooldown = 30; const a = Math.atan2(satellite.y - player.y, satellite.x - player.x); playerBullets.push({ x: player.x, y: player.y, vx: Math.cos(a)*12, vy: Math.sin(a)*12, transferred: false }); createParticles(player.x+20, player.y, '#fff', 5); }
function spawnEnemy() { if (enemies.length < 3 && Math.random() < 0.02) enemies.push({ x: 650 + Math.random()*100, y: 450, shootTimer: Math.random()*100 + 50 }); }
function createParticles(x, y, col, cnt) { for(let i=0; i<cnt; i++) particles.push({ x:x, y:y, vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6, life:20, color:col }); }
function resetGame() { score = 0; hp = 100; gameOver = false; playerBullets = []; enemyBullets = []; enemies = []; particles = []; player.isAiming = false; statusMessage.style.display = 'none'; scoreVal.innerText = score; hpVal.innerText = hp; }

function update() {
    if (gameOver) return;
    if (player.cooldown > 0) player.cooldown--;
    player.y = player.isAiming ? player.baseY - 25 : player.baseY;
    
    if (keys['ArrowUp']) satellite.y = Math.max(satellite.radius, satellite.y - satellite.speed);
    if (keys['ArrowDown']) satellite.y = Math.min(canvas.height - satellite.radius, satellite.y + satellite.speed);
    if (keys['ArrowLeft']) satellite.x = Math.max(satellite.radius, satellite.x - satellite.speed);
    if (keys['ArrowRight']) satellite.x = Math.min(canvas.width - satellite.radius, satellite.x + satellite.speed);

    spawnEnemy();
    enemies.forEach(e => { e.shootTimer--; if(e.shootTimer<=0) { e.shootTimer = 120 + Math.random()*60; const a = Math.atan2(player.baseY - e.y, player.x - e.x); enemyBullets.push({ x:e.x, y:e.y, vx:Math.cos(a)*5, vy:Math.sin(a)*5 }); } });

    for (let i = playerBullets.length - 1; i >= 0; i--) {
        let b = playerBullets[i]; b.x += b.vx; b.y += b.vy;
        if (!b.transferred && satellite.active && Math.hypot(b.x - satellite.x, b.y - satellite.y) < satellite.radius + 5) {
            b.transferred = true;
            if (enemies.length > 0) {
                let tgt = enemies[0], minDist = Math.hypot(enemies[0].x - satellite.x, enemies[0].y - satellite.y);
                enemies.forEach(e => { let d = Math.hypot(e.x - satellite.x, e.y - satellite.y); if(d < minDist) { minDist = d; tgt = e; } });
                const a = Math.atan2(tgt.y - satellite.y, tgt.x - satellite.x); b.vx = Math.cos(a)*15; b.vy = Math.sin(a)*15; b.x = satellite.x; b.y = satellite.y; createParticles(satellite.x, satellite.y, '#00ffcc', 15);
            }
        }
        for (let j = enemies.length - 1; j >= 0; j--) {
            if (Math.hypot(b.x - enemies[j].x, b.y - enemies[j].y) < 20) { createParticles(enemies[j].x, enemies[j].y, '#ff3366', 15); enemies.splice(j, 1); playerBullets.splice(i, 1); score += 100; scoreVal.innerText = score; break; }
        }
        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) playerBullets.splice(i, 1);
    }

    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        let b = enemyBullets[i]; b.x += b.vx; b.y += b.vy;
        if (b.x >= rock.x && b.x <= rock.x + rock.w && b.y >= rock.y && b.y <= rock.y + rock.h) { createParticles(b.x, b.y, '#666', 3); enemyBullets.splice(i, 1); continue; }
        if (Math.hypot(b.x - player.x, b.y - player.y) < 20 && player.isAiming) { hp -= 34; if(hp < 0) hp = 0; hpVal.innerText = hp; createParticles(player.x, player.y, '#ff0000', 10); enemyBullets.splice(i, 1); if(hp <= 0) { gameOver = true; statusMessage.style.display = 'block'; } }
        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) enemyBullets.splice(i, 1);
    }
    particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.life--; if(p.life<=0) particles.splice(i, 1); });
    satellite.pulse += 0.1;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#2c3e50'; ctx.beginPath(); ctx.moveTo(mountain.x, mountain.y); mountain.forEach(m => ctx.lineTo(m.x, m.y)); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#7f8c8d'; ctx.fillRect(rock.x, rock.y, rock.w, rock.h);
    ctx.fillStyle = player.isAiming ? '#ffcc00' : '#3498db'; ctx.beginPath(); ctx.arc(player.x, player.y, 12, 0, Math.PI*2); ctx.fill();
    if (player.isAiming) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(player.x + 20, player.y); ctx.stroke(); }
    if (satellite.active) {
        ctx.save(); ctx.translate(satellite.x, satellite.y); ctx.strokeStyle = 'rgba(0, 255, 200, ' + (0.1 + Math.sin(satellite.pulse)*0.1) + ')'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, satellite.radius + 15, 0, Math.PI*2); ctx.stroke();
        ctx.fillStyle = '#00ffcc'; ctx.beginPath(); ctx.arc(0, 0, satellite.radius, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(0, 10); ctx.stroke(); ctx.restore();
        if (player.isAiming) { ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(satellite.x, satellite.y); ctx.stroke(); }
    }
    enemies.forEach(e => { ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(e.x, e.y, 15, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(e.x - 8, e.y - 5, 5, 5); });
    playerBullets.forEach(b => { ctx.fillStyle = b.transferred ? '#00ffcc' : '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill(); });
    enemyBullets.forEach(b => { ctx.fillStyle = '#ff5533'; ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill(); });
    particles.forEach(p => { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 3, 3); });
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
